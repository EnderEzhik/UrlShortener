user root;
worker_processes 1;

events {
}

http {
    include mime.types;
    sendfile on;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80;
        root /frontend;

        location / {
            try_files $uri $uri.html $uri/index.html =404;
            error_page 404 =404 /not-found.html;
        }

        location = /api/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://shortener:5000/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =404 /not-found.html;
            error_page 500 =500 /error.html;
        }

        location = /api/auth/register {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://shortener:5000/api/auth/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =404 /not-found.html;
            error_page 500 =500 /error.html;
        }

        location /api/ {
            proxy_pass http://shortener:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =404 /not-found.html;
            error_page 500 =500 /error.html;
        }

        location /r/ {
            proxy_pass http://shortener:5000/r/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =404 /not-found.html;
            error_page 500 =500 /error.html;
        }
    }
}
