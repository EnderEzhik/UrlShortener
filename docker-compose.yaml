services:
    database:
        image: postgres:16-alpine
        container_name: database
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - internal
            - external
        ports:
            - "${DB_EXTERNAL_PORT}:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
    
    redis:
        image: redis:8.4-alpine
        container_name: redis
        healthcheck:
            test: ["CMD-SHELL", "redis-cli", "-a", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - internal
            - external
        ports:
            - "${REDIS_EXTERNAL_PORT}:6379"
        volumes:
            - redis-data:/data
    
    shortener:
        build:
            context: ./Shortener/
            dockerfile: ./Dockerfile
        container_name: shortener
        env_file:
            - .env
        environment:
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_URLS=http://*:${BACKEND_PORT}
            - ConnectionStrings__DATABASE=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
            - ConnectionStrings__REDIS=${REDIS_HOST}:${REDIS_PORT}
        depends_on:
            database:
                condition: service_healthy
        networks:
            - internal
            - external
        ports:
            - "${BACKEND_PORT}:${BACKEND_PORT}"
    
    shortener.web.ui:
        build:
            context: ./Shortener.WebUI
            dockerfile: ./Dockerfile
        container_name: shortener.web.ui
        environment:
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_URLS=http://*:${FRONTEND_PORT}
            - API_SERVER_ADDRESS=http://shortener:${BACKEND_PORT}/api
        depends_on:
            - shortener
        networks:
            - internal
            - external
        ports:
            - "${FRONTEND_PORT}:${FRONTEND_PORT}"
        volumes:
            - ./Shortener.WebUI/wwwroot:/app/wwwroot:ro

networks:
    internal:
        driver: bridge
        internal: true
    external:
        driver: bridge

volumes:
    db-data:
    redis-data:
